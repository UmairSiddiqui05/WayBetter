# WayBetter API — contract-first stub (v0.2)
# Purpose: lock the JSON shapes so backend and web agents can build in parallel.
# FastAPI will generate the authoritative spec later; until then, THIS FILE is the
# contract. Changes require a PROGRESS.md log entry and a version bump here.
# Rules baked in: display-ready JSON (N-01), provenance on user-facing data (N-02),
# no client-supplied user identity (N-06), server-issued anonymous sessions (N-05).
# v0.2.0 (2026-10-14): daily round-trip commute — TripSearchRequest.return_time and
# RouteOption.round_trip (RoundTrip, Savings). Additive; v0.1 clients ignore them.
# v0.7.0 (2026-10-14): /trip/ai-parse response gains `choices` (answers to the clarifying
# question, each a place text for origin or destination). Additive.
# v0.8.0 (2026-10-15, D-21): BREAKING — RouteOption.label (one string) is replaced by
# RouteOption.badges [{id, text}]. Additive: sort_mode `cleanest`; RouteOption.emissions_kg is
# now required and documented; RouteLeg.map_links; TripSearchResponse.filtered_out; bounds on
# VehicleProfile.mpg / fuel_price_per_gallon and Preferences.max_walk_minutes.

openapi: 3.1.0
info:
  title: WayBetter API
  version: 0.8.0
  description: >
    Park-and-ride decision engine. All routing, scoring, labeling, and explanation
    logic is server-side; clients render these payloads without recomputation.

servers:
  - url: /api/v1

# Default: public (rate-limited by IP). Operations that write or spend provider
# budget additionally require the anonymous session token.
security: []

paths:
  /session:
    post:
      summary: Issue an anonymous session token (rate-limiting + feedback attribution)
      responses:
        "201":
          description: New anonymous session
          content:
            application/json:
              schema:
                type: object
                required: [session_token]
                properties:
                  session_token: { type: string }

  /trip/search:
    post:
      summary: Compare full-drive, full-transit, and park-and-ride itineraries
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripSearchRequest" }
      responses:
        "200":
          description: Ranked route options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSearchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "422":
          description: Request outside region bounds or caps (rejected before provider calls, N-05)
        "429": { description: Rate limited }

  /trip/ai-parse:
    post:
      summary: Parse a natural-language trip request into a structured draft TripSearchRequest
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: >
            Draft request + list of missing critical fields the client must collect
            before calling /trip/search. The LLM only fills schema fields; it never
            invents stations, prices, or schedules (F-08).
          content:
            application/json:
              schema:
                type: object
                required: [draft, missing_fields, interpretation, parser]
                properties:
                  draft: { $ref: "#/components/schemas/TripSearchDraft" }
                  missing_fields:
                    type: array
                    items: { type: string }
                    description: Draft fields the client must collect (origin, destination, target_time, return_time)
                  clarifying_question:
                    type: [string, "null"]
                  choices:
                    type: array
                    description: >
                      v0.7.0, additive. Answers to clarifying_question when it has fixed ones
                      (a street found in several towns), each a place as text for one field.
                    items:
                      type: object
                      required: [field, text]
                      properties:
                        field: { type: string, enum: [origin, destination] }
                        text: { type: string }
                  interpretation:
                    type: array
                    description: >
                      v0.3.0, additive. "Here's what I understood": one row per draft value with
                      where it came from — ai_generated (read from the user's words), estimated
                      (approximate place, or an app default when is_default is true), unknown
                      (not found / not supported).
                    items: { $ref: "#/components/schemas/InterpretationItem" }
                  parser:
                    type: string
                    description: v0.3.0. Which parser read the text — "rules", or "ollama:<model>"
                  parser_note:
                    type: [string, "null"]
                    description: v0.3.0. Why the fallback parser was used, when it was
        "401": { description: Missing or invalid session token }
        "422": { description: Empty text or longer than 1000 characters }

  /trip/{request_id}:
    get:
      summary: Re-fetch a previously computed search result
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Same shape as /trip/search response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSearchResponse" }
        "404": { description: Unknown or expired request_id }

  /places/resolve:
    post:
      summary: Resolve one typed place (the From/To fields) to a point
      description: >
        v0.4.0. Same rules as /trip/ai-parse: verified corridor places first, then the address
        lookup (OpenStreetMap Nominatim, accepted only when name and town agree with the text),
        then an approximate town. Never substitutes a different place; not found = place null
        plus a clarifying question.
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, role]
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
                role: { type: string, enum: [origin, destination] }
      responses:
        "200":
          description: The resolved place, or null with a question
          content:
            application/json:
              schema:
                type: object
                required: [place, value_label, provenance]
                properties:
                  place:
                    oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }]
                  value_label: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
                  note: { type: [string, "null"], description: "How it was found, incl. OSM attribution" }
                  clarifying_question: { type: [string, "null"] }
                  suggestions:
                    type: array
                    items: { type: string }
                    description: >
                      v0.5.0, additive. When the text fits several places (a street in more than
                      one town, "75 Main St" that is 75 East or 75 West Main Street): each as text
                      the client can show as a choice and send back. Never auto-picked.
        "401": { description: Missing or invalid session token }
        "422": { description: "Empty text, longer than 200 characters, or bad role" }

  /stations/search:
    get:
      summary: Search stations (name/geo)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radius_m, in: query, schema: { type: integer, maximum: 30000 } }
      responses:
        "200":
          description: Matching stations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }

  /stations/{station_id}:
    get:
      summary: Station detail (canonical ID, not raw GTFS ID — N-03)
      parameters:
        - { name: station_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Station detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "404": { description: Unknown station }

  /parking/{station_id}:
    get:
      summary: Parking facilities for a station
      parameters:
        - { name: station_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Parking facilities with provenance and verification metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParkingFacility" }

  /feedback/parking:
    post:
      summary: Anonymous parking report (rate-limited, sanitized — F-15)
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parking_id, outcome, observed_at]
              properties:
                parking_id: { type: string }
                outcome: { type: string, enum: [found_spot, lot_full, lot_closed, price_wrong, other] }
                observed_at: { type: string, format: date-time }
                note: { type: string, maxLength: 280 }
      responses:
        "202": { description: Accepted }
        "429": { description: Rate limited }

  /providers/status:
    get:
      summary: Health of upstream providers (OTP, driving, geocoding, LLM, alert feeds)
      responses:
        "200":
          description: Per-provider health map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  enum: [ok, degraded, down]

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token

  responses:
    ValidationError:
      description: Request failed schema validation
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items: { type: object }

  schemas:
    Provenance:
      type: string
      description: Data-source status shown to users (N-02)
      enum: [live, scheduled, estimated, unknown, user_reported, ai_generated]

    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        label: { type: string }

    VehicleProfile:
      type: object
      properties:
        type: { type: string, enum: [compact, sedan, suv, hybrid, ev, custom] }
        mpg:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 150
          description: >
            The user's own fuel economy. Null = the region's data-file average. A sent value is
            echoed in cost notes as "your value" with provenance user_reported (N-02).
        kwh_per_mile: { type: [number, "null"] }
        fuel_price_per_gallon:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 20
          description: The user's own gas price (USD). Null = the data-file average. user_reported when sent.
        electricity_price_per_kwh: { type: [number, "null"] }
        toll_payment: { type: string, enum: [ezpass, cash], default: ezpass }

    TripSearchRequest:
      type: object
      required: [origin, destination, time_mode]
      properties:
        origin: { $ref: "#/components/schemas/LatLng" }
        destination: { $ref: "#/components/schemas/LatLng" }
        time_mode: { type: string, enum: [leave_now, leave_at, arrive_by] }
        target_time:
          type: [string, "null"]
          format: date-time
          description: Required unless leave_now. Timezone-aware (region config timezone).
        return_time:
          type: [string, "null"]
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: >
            Local "HH:MM" the commuter heads home the same day, for the daily round-trip view.
            Null = the corridor's default (data, not code). Must be later than the departure.
        allowed_modes:
          type: array
          items: { type: string, enum: [car, transit, walk] }
          description: bike/scooter arrive with the GBFS fast-follow (F-20)
        preferences:
          type: object
          properties:
            sort_mode:
              type: string
              enum: [best_overall, fastest, cheapest, least_driving, most_driving, fewest_transfers, best_parking, cleanest]
              description: >
                Server-side ranking (F-06). v0.8.0 adds `cleanest` (least tailpipe CO2; unknown
                CO2 ranks last). Cost-based modes rank options with an unknown cost part after
                complete totals. Ties fall back to door-to-door time.
            avoid_tolls:
              type: boolean
              default: false
              description: >
                Hide options whose driving (either trip) pays a road, bridge or tunnel toll or the
                congestion toll, or may pay one that is not priced. When the driving provider
                offers alternative routes, one our toll data prices at $0 is used instead.
                Hidden options are listed in TripSearchResponse.filtered_out (F-07).
            avoid_city_driving: { type: boolean, default: false }
            max_walk_minutes:
              type: [integer, "null"]
              minimum: 0
              maximum: 120
              description: Hide options that walk longer than this on the morning trip (listed in filtered_out).
            max_transfers: { type: [integer, "null"] }
            cost_sensitivity: { type: string, enum: [low, medium, high] }
            driving_penalty: { type: string, enum: [low, medium, high] }
        vehicle_profile: { $ref: "#/components/schemas/VehicleProfile" }
        # NOTE: no user_id field. Identity is server-side only until auth exists (N-06).

    TripSearchDraft:
      type: object
      description: >
        v0.3.0. TripSearchRequest with origin/destination nullable until resolved (a place
        that could not be resolved is listed in missing_fields instead of guessed). Same
        field names, so a complete draft posts to /trip/search unchanged.
      required: [origin, destination, time_mode]
      properties:
        origin:
          oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }]
        destination:
          oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }]
        time_mode: { type: string, enum: [leave_now, leave_at, arrive_by] }
        target_time: { type: [string, "null"], format: date-time }
        return_time: { type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        preferences:
          type: object
          properties:
            sort_mode: { type: string, enum: [best_overall, fastest, cheapest, least_driving] }
        vehicle_profile: { $ref: "#/components/schemas/VehicleProfile" }

    InterpretationItem:
      type: object
      required: [field, value_label, provenance, is_default]
      properties:
        field: { type: string, description: "Draft field path, e.g. origin or preferences.sort_mode" }
        value_label: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }
        is_default: { type: boolean, description: True when the user did not say it (app default) }
        note: { type: [string, "null"], description: "Where the value came from, incl. OSM attribution for geocoded places" }

    CostBreakdown:
      type: object
      required: [total, currency]
      properties:
        currency: { type: string, default: USD }
        gas_or_ev: { $ref: "#/components/schemas/MoneyEstimate" }
        parking: { $ref: "#/components/schemas/MoneyEstimate" }
        transit_fare: { $ref: "#/components/schemas/MoneyEstimate" }
        tolls: { $ref: "#/components/schemas/MoneyEstimate" }
        congestion_fee: { $ref: "#/components/schemas/MoneyEstimate" }
        total: { type: number }

    MoneyEstimate:
      type: object
      required: [amount, provenance]
      properties:
        amount: { type: [number, "null"] }
        provenance: { $ref: "#/components/schemas/Provenance" }
        note: { type: [string, "null"] }

    RouteLeg:
      type: object
      required: [leg_id, mode, start_time, end_time, duration_minutes]
      properties:
        leg_id: { type: string }
        mode: { type: string, enum: [car, transit, walk] }
        start_location: { $ref: "#/components/schemas/LatLng" }
        end_location: { $ref: "#/components/schemas/LatLng" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        duration_minutes: { type: number }
        distance_miles: { type: [number, "null"] }
        agency: { type: [string, "null"] }
        route_name: { type: [string, "null"] }
        headsign: { type: [string, "null"] }
        polyline: { type: [string, "null"], description: Encoded polyline for map display }
        time_provenance: { $ref: "#/components/schemas/Provenance" }
        map_links:
          type: array
          description: >
            v0.8.0. Car legs only (empty otherwise): open the same drive in a map app (F-17).
            Built from URL templates in the region config; the app's own route can differ.
          items: { $ref: "#/components/schemas/MapLink" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }

    MapLink:
      type: object
      required: [app_id, label, url]
      properties:
        app_id: { type: string, description: "e.g. google_maps, apple_maps" }
        label: { type: string }
        url: { type: string, format: uri }

    Badge:
      type: object
      description: >
        v0.8.0. A server-awarded tag (N-01). Awarded only to a unique winner among the options
        returned: a tie on the badge's own metric (whole minutes, cents, tenths of a kg CO2,
        transfer count) awards no badge, and a lone option gets none. Cost badges consider
        complete totals only; cleanest considers known CO2 only. most_driving is a sort, never
        a badge.
      required: [id, text]
      properties:
        id: { type: string, enum: [best_overall, fastest, cheapest, least_driving, fewest_transfers, cleanest] }
        text: { type: string, description: 'Display text, e.g. "Cheapest"' }

    FilteredRoute:
      type: object
      description: v0.8.0. An option the request's filters hid, with every reason (never silently dropped, F-07)
      required: [route_id, summary, reasons]
      properties:
        route_id: { type: string }
        summary: { type: string }
        reasons:
          type: array
          items: { type: string }

    Alert:
      type: object
      required: [agency, summary, provenance]
      properties:
        agency: { type: string }
        summary: { type: string, description: 'Sanitized plain text, truncated for lists (F-11)' }
        full_text: { type: [string, "null"], description: 'Sanitized plain text, never HTML' }
        provenance: { $ref: "#/components/schemas/Provenance" }

    RouteOption:
      type: object
      required: [route_id, badges, summary, total_minutes, cost_breakdown, emissions_kg, legs]
      properties:
        route_id: { type: string }
        badges:
          type: array
          description: v0.8.0, replaces `label`. Empty when the option wins nothing outright.
          items: { $ref: "#/components/schemas/Badge" }
        summary: { type: string }
        total_minutes: { type: number }
        drive_minutes: { type: number }
        transit_minutes: { type: number }
        walk_minutes: { type: number }
        wait_minutes: { type: number }
        drive_miles: { type: number }
        transfer_count: { type: integer }
        cost_breakdown: { $ref: "#/components/schemas/CostBreakdown" }
        emissions_kg:
          allOf: [{ $ref: "#/components/schemas/MoneyEstimate" }]
          description: >
            Tailpipe CO2 of the morning trip; `amount` is in kg (not dollars). Gallons burned x
            EPA kg CO2 per gallon, plus rail passenger-miles x EPA per-passenger-mile factors, all
            from data files (estimated). Unknown when any leg's distance or factor is unknown.
        parking:
          type: [object, "null"]
          properties:
            facility: { $ref: "#/components/schemas/ParkingFacility" }
            confidence: { type: string, enum: [high, medium, low, unknown] }
        reliability: { type: string, enum: [high, medium, low] }
        warnings:
          type: array
          items: { type: string }
        explanation:
          type: object
          properties:
            text: { type: string }
            provenance: { $ref: "#/components/schemas/Provenance" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/RouteLeg" }
        round_trip:
          oneOf:
            - { $ref: "#/components/schemas/RoundTrip" }
            - { type: "null" }
          description: The daily commute (morning + trip home); null when no trip home was found

    RoundTrip:
      type: object
      description: >
        Server-computed daily commute (N-01). Once-a-day charges (parking, congestion toll) are
        counted once; per-trip costs (gas, fares, tolls in each tolled direction) twice.
      required: [return_summary, return_legs, return_minutes, daily_minutes,
                 return_cost_breakdown, daily_cost_breakdown, monthly_cost, annual_cost,
                 savings_vs_drive]
      properties:
        return_summary: { type: string }
        return_legs:
          type: array
          items: { $ref: "#/components/schemas/RouteLeg" }
        return_minutes: { type: number }
        daily_minutes: { type: number }
        return_cost_breakdown: { $ref: "#/components/schemas/CostBreakdown" }
        daily_cost_breakdown: { $ref: "#/components/schemas/CostBreakdown" }
        monthly_cost: { $ref: "#/components/schemas/MoneyEstimate" }
        annual_cost: { $ref: "#/components/schemas/MoneyEstimate" }
        savings_vs_drive:
          oneOf:
            - { $ref: "#/components/schemas/Savings" }
            - { type: "null" }

    Savings:
      type: object
      description: Driving all the way minus this option; amount null when either side is unknown
      required: [daily, monthly, annual]
      properties:
        daily: { $ref: "#/components/schemas/MoneyEstimate" }
        monthly: { $ref: "#/components/schemas/MoneyEstimate" }
        annual: { $ref: "#/components/schemas/MoneyEstimate" }

    TripSearchResponse:
      type: object
      required: [request_id, routes, sort_options, disclaimers]
      properties:
        request_id: { type: string }
        routes:
          type: array
          items: { $ref: "#/components/schemas/RouteOption" }
        filtered_out:
          type: array
          description: v0.8.0. Options hidden by avoid_tolls / max_walk_minutes, each with its reasons
          items: { $ref: "#/components/schemas/FilteredRoute" }
        sort_options:
          type: array
          items: { type: string }
        disclaimers:
          type: array
          items: { type: string }
          description: Required user-facing disclaimers (PRD §20), server-supplied

    Station:
      type: object
      required: [station_id, name, location]
      properties:
        station_id: { type: string, description: Canonical WayBetter ID (N-03) }
        name: { type: string }
        agency: { type: string }
        location: { $ref: "#/components/schemas/LatLng" }
        modes:
          type: array
          items: { type: string }
        has_parking_data: { type: boolean }

    ParkingFacility:
      type: object
      required: [parking_id, name, location, provenance]
      properties:
        parking_id: { type: string }
        station_id: { type: string }
        name: { type: string }
        location: { $ref: "#/components/schemas/LatLng" }
        type: { type: string, enum: [park_and_ride, garage, lot, street] }
        capacity: { type: [integer, "null"] }
        price_daily: { $ref: "#/components/schemas/MoneyEstimate" }
        price_hourly: { $ref: "#/components/schemas/MoneyEstimate" }
        payment_methods:
          type: array
          items: { type: string }
        permit_required: { type: [boolean, "null"] }
        overnight_allowed: { type: [boolean, "null"] }
        restrictions: { type: [string, "null"] }
        provenance: { $ref: "#/components/schemas/Provenance" }
        source_url: { type: [string, "null"] }
        last_verified_at: { type: [string, "null"], format: date }
