[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waybetter-backend"
version = "0.1.0"
description = "WayBetter park-and-ride decision engine — API service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.2",
  "httpx>=0.27",
  "structlog>=24.4",
  "pyyaml>=6.0",
]

[project.scripts]
waybetter-ingest = "app.ingestion.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S104", # binding 0.0.0.0 is intentional inside a container
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test; S105/S106 fire on obviously-fake fixture
# secrets, which is exactly what a secrets test must contain.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
