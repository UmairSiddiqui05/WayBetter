# Demo-sprint corridor (D-18): which park-and-ride lots to compare, where the train goes,
# and the preset places the demo page offers. Facts about places (e.g. "inside the
# Congestion Relief Zone") are human-checkable here instead of a polygon test, because
# the zone polygon is not sourced yet (PROGRESS blocker B-5).
corridor_id: njt-nec-nyp
name: NJ TRANSIT Northeast Corridor to New York Penn Station
transit_feed: njt_rail
hub_station: nyc-metro:njt_rail:new-york-penn-station
assumed_parking_hours: 11      # car parked ~7am, collected ~6pm; decides the parking rate tier
walk_mph: 3.0
walk_detour_factor: 1.3        # street grid vs straight line
max_walk_miles: 1.0            # beyond this the last leg is the subway
hub_boarding_buffer_minutes: 5  # evening: reach Penn, find the track, board (estimated)
subway:
  access_minutes: 8            # walk to platform + average wait (estimated)
  mph: 12.0                    # average subway speed incl. stops (estimated)
commute:
  # Daily round-trip view: morning leg as searched, plus the evening trip home.
  default_return_time: "17:30"   # leave the destination at 5:30 PM unless the request says otherwise
  default_departure_time: "07:00"  # assumed morning departure when a plain-words request names no time
  working_days_per_year: 250
  status: estimated              # a calendar count applied to one commuter (no leave, no remote days)
  source:
    name: "OPM 2026 federal holiday schedule: 261 weekdays in 2026 minus 11 holidays, all on weekdays"
    url: https://www.opm.gov/policy-data-oversight/pay-leave/federal-holidays/
    retrieved: 2026-10-14
    notes: 250 / 12 = 20.8 working days a month. Derived, not stated by OPM.
# Places: `aliases` are other names people use (matched after lowercasing and dropping
# punctuation). `town` marks an origin a plain-words request may fall back to, approximately,
# when it names a business we don't know in that town (/trip/ai-parse). `source` records
# where coordinates came from that a human did not pick by hand.
origins:
  - {id: princeton, label: "Princeton (Nassau St)", lat: 40.3500, lng: -74.6597, town: Princeton}
  - {id: lawrenceville, label: "Lawrenceville (Business Rte 206)", lat: 40.2968, lng: -74.7296, town: Lawrenceville}
  - {id: plainsboro, label: "Plainsboro (Scudders Mill Rd)", lat: 40.3330, lng: -74.5946, town: Plainsboro}
  - id: raritan
    label: "Raritan (town center)"
    lat: 40.5671
    lng: -74.6347
    town: Raritan
    aliases: [raritan nj, raritan new jersey, raritan borough, raritan town center]
    source: >-
      OpenStreetMap via Nominatim: Raritan borough, Somerset County, NJ (relation 170844),
      center 40.5671022, -74.6347275. © OpenStreetMap contributors, ODbL 1.0. Retrieved 2026-10-14.
destinations:
  - id: times-square
    label: "Times Square (1540 Broadway)"
    lat: 40.7580
    lng: -73.9855
    in_congestion_relief_zone: true   # W 46th St, south of 60th St
    parking_area: midtown-manhattan
    aliases: [times sq, 1540 broadway]
  - id: bryant-park
    label: "Bryant Park (6th Ave & W 42nd St)"
    lat: 40.7540
    lng: -73.9840
    in_congestion_relief_zone: true
    parking_area: midtown-manhattan
  - id: javits-center
    label: "Javits Center (429 11th Ave)"
    lat: 40.7584
    lng: -74.0022
    aliases:
      - javits
      - javits center
      - javits convention center
      - jacob javits center
      - jacob k javits center
      - jacob k javits convention center
      - jacob javits convention center
    # Human-confirmed 2026-10-14 (Umair): inside the zone. 11th Ave at W 34th-40th St is a local
    # street south of 60 St; the zone excludes only Route 9A (12th Ave), FDR Dr, Carey Tunnel links.
    in_congestion_relief_zone: true
    # Unknown on purpose (human decision 2026-10-14): no sourced garage rate near Javits; the only
    # area on file is a W 46th St garage ~1 mile away, and borrowing its price would be a guess.
    parking_area: null
    source: >-
      OpenStreetMap: Jacob K. Javits Convention Center, 429 11th Ave, New York, NY,
      40.7584, -74.0022. © OpenStreetMap contributors, ODbL 1.0. Retrieved 2026-10-14.
